<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Gravity Runner</title>
  <meta name="description" content="A neon-themed infinite runner where you flip gravity to dodge obstacles. How far can you go?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="scoreDisplay">
      <span class="label">SCORE</span>
      <span id="score" class="value">0</span>
    </div>
    <div id="comboDisplay" class="hidden">
      <span id="comboText">x2 COMBO</span>
    </div>
    <div id="highScoreHud">
      <span class="label">BEST</span>
      <span id="bestScore" class="value">0</span>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1 class="title">
        <span class="title-line-1">NEON</span>
        <span class="title-line-2">GRAVITY</span>
        <span class="title-line-3">RUNNER</span>
      </h1>
      <p class="subtitle">Flip gravity. Dodge everything. Survive.</p>
      <button id="playBtn" class="neon-btn">
        <span class="btn-icon">▶</span> PLAY
      </button>
      <p class="hint">Press <kbd>SPACE</kbd> or <kbd>TAP</kbd> to flip gravity</p>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="overlay hidden">
    <div class="panel game-over-panel">
      <h2 class="game-over-title">GAME OVER</h2>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <span id="finalScore" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span id="finalBest" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">OBSTACLES</span>
          <span id="finalObstacles" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">MAX COMBO</span>
          <span id="finalCombo" class="stat-value">x1</span>
        </div>
      </div>
      <div id="newHighScore" class="hidden">
        <span class="new-record">★ NEW RECORD! ★</span>
      </div>
      <button id="restartBtn" class="neon-btn restart-btn">
        <span class="btn-icon">↻</span> PLAY AGAIN
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
